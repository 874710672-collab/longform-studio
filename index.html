<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>长篇工坊</title>
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=59">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png?v=59">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png?v=59">
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png?v=59">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="长篇工坊">
<meta name="description" content="把35万字长篇拆成34个短篇单元逐个生产，交棒单保证连续性">
<link rel="stylesheet" href="style.css?v=59">
<link rel="stylesheet" href="style2.css?v=59">
<link rel="stylesheet" href="ll.css?v=59">
</head>
<body>
<header id="topbar">
  <div class="tb-left">
    <button class="icon-btn" id="btnHome" title="书库">☰</button>
    <div class="tb-title">
      <span id="tbProject">长篇工坊</span>
      <small id="tbSub">选择或新建一本书</small>
    </div>
  </div>
  <div class="tb-right">
    <button class="ghost-btn" id="btnBook" title="全书层：总纲 / 人物 / 推进表">◈<span class="lbl"> 全书</span></button>
    <button class="ghost-btn" id="btnFacts" title="硬事实表：人物 / 规则 / 伏笔 / 时间线">◉<span class="lbl"> 事实</span></button>
    <button class="ghost-btn" id="btnGrid" title="主线推进表">▦<span class="lbl"> 推进表</span></button>
    <button class="ghost-btn" id="btnUnits" title="单元列表">▤<span class="lbl"> 单元</span></button>
    <button class="ghost-btn" id="btnAudit" title="进度对账：主线有没有跑偏">◎<span class="lbl"> 对账</span></button>
    <button class="ghost-btn" id="btnChapter" title="章节编排：手动把定稿拆成章节">📖<span class="lbl"> 章节</span></button>
    <button class="ghost-btn" id="btnExport">导出</button>
    <button class="icon-btn" id="btnSet" title="设置">⚙︎</button>
  </div>
</header>

<nav id="steps"></nav>

<main id="stage"></main>

<footer id="dock">
  <div class="dock-info" id="dockInfo">—</div>
  <div class="dock-acts">
    <button class="ghost-btn" id="btnStop" hidden>停止</button>
    <button class="ghost-btn" id="btnFb" hidden title="打开审核意见窗口">💬 意见</button>
    <button class="ghost-btn" id="btnRevise" title="带原稿+意见，只改提到的地方">✎ 改原稿</button>
    <button class="ghost-btn" id="btnRegen" title="不带原稿，从头再写一版">↻ 重新生成</button>
    <button class="primary-btn" id="btnGen">生成</button>
    <button class="primary-btn" id="btnApprove" hidden>通过 · 进入下一环节</button>
  </div>
</footer>

<div id="sheet" class="sheet-mask" hidden>
  <div class="sheet" id="sheetBody"></div>
</div>

<div id="fbFloat" class="fb-float" hidden>
  <div class="fb-float-head" id="fbFloatHead">
    <span class="fb-drag">⠿</span>
    <span class="fb-float-title">审核意见</span>
    <button class="fb-mini" id="fbFloatToggle">▾</button>
  </div>
  <div class="fb-float-body" id="fbFloatBody">
    <textarea id="fbFloatTa" placeholder="例：反派动机太弱，要写成他当年被主角父亲救过一次…"></textarea>
    <div class="fb-float-hint">写完后点底栏「✎ 改原稿」或「↻ 按意见重写」</div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="store.js?v=59"></script>
<script src="bookstore.js?v=59"></script>
<script src="lprompts.js?v=59"></script>
<script src="api.js?v=59"></script>
<script src="lcastparse.js?v=59"></script>
<script src="gridmodel.js?v=59"></script>
<script src="gridversions.js?v=59"></script>
<script src="chaptermodel.js?v=59"></script>
<script src="partversions.js?v=59"></script>
<script src="lengine.js?v=59"></script>
<script src="lcheck.js?v=59"></script>
<script src="lrelaycheck.js?v=59"></script>
<script src="app.js?v=59"></script>
<script src="appbook.js?v=59"></script>
<script src="appunits.js?v=59"></script>
<script src="appfacts.js?v=59"></script>
<script src="appunit.js?v=59"></script>
<script src="appflow.js?v=59"></script>
<script src="appaudit.js?v=59"></script>
<script src="backup.js?v=59"></script>
<script src="appbackup.js?v=59"></script>
<script src="revise.js?v=59"></script>
<script src="apprevise.js?v=59"></script>
<script src="appgrid.js?v=59"></script>
<script src="appfloat.js?v=59"></script>
<script src="appchapter.js?v=59"></script>
</body>
</html>
